<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 280px; padding: 14px; margin: 0; }
  #verdict { font-size: 18px; font-weight: 700; margin: 8px 0 4px; }
  .ok { color: #2e7d32; } .bad { color: #d32f2f; }
  #url { font-size: 11px; color: #666; word-break: break-all; }
  #bar { height: 8px; background: #eee; border-radius: 4px; margin-top: 10px; }
  #fill { height: 100%; border-radius: 4px; }
  #note { font-size: 10px; color: #999; margin-top: 12px; }
</style></head>
<body>
  <div><strong>PhishLens</strong></div>
  <div id="verdict">Scoring…</div>
  <div id="url"></div>
  <div id="bar"><div id="fill" style="width:0%"></div></div>
  <div id="note">Runs entirely on-device. Prototype — not a substitute for caution.</div>
  <script src="popup.js"></script>
</body></html>
